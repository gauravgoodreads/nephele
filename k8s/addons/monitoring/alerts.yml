# Alert rules. Each one says what is wrong and where to look first;
# docs/RUNBOOK.md has the full steps for each alert.
groups:
  - name: nephele-application
    rules:
      - alert: VoteQueueBacklog
        expr: max(nephele_queue_depth) > 500
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: Votes are piling up in the queue
          description: "{{ $value }} votes have been waiting for over a minute. Check the worker replicas (KEDA) and the database."

      - alert: WorkerStalled
        expr: |
          max(nephele_queue_depth) > 0
          and on() (max(max_over_time(nephele_votes_saved[2m])) - max(min_over_time(nephele_votes_saved[2m]))) == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: Votes are queued but none are being saved
          description: No vote has been saved for 2 minutes while votes are waiting. Check worker pods and database connectivity.

      - alert: VoteServiceDown
        expr: absent(up{job="nephele-pods", app="vote"} == 1)
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: No vote pod is answering
          description: Prometheus cannot reach any vote pod. Users cannot vote.

  - name: nephele-traffic
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(nginx_ingress_controller_requests{namespace="nephele", status=~"5.."}[2m]))
            / sum(rate(nginx_ingress_controller_requests{namespace="nephele"}[2m])) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: More than 5% of requests are failing
          description: "{{ $value | humanizePercentage }} of requests returned a 5xx error over the last 2 minutes."

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="nephele"}[2m]))) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: 95th percentile response time is above 500 ms
          description: "p95 latency is {{ $value | humanizeDuration }}."

  - name: nephele-platform
    rules:
      - alert: PodRestartLoop
        expr: increase(kube_pod_container_status_restarts_total{namespace="nephele"}[10m]) > 3
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pod }} keeps restarting"
          description: "{{ $value }} restarts in 10 minutes. Check its logs with kubectl logs --previous."

      - alert: DeploymentDegraded
        expr: kube_deployment_status_replicas_available{namespace="nephele"} < kube_deployment_spec_replicas{namespace="nephele"}
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.deployment }} has fewer ready pods than wanted"
          description: Some pods cannot start or are not ready. Check events and resource quota.
