# Result: live results page. Kept at one replica because its WebSocket
# connections are held in memory (several replicas would need sticky sessions).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels: { app: result }
spec:
  replicas: 1
  selector:
    matchLabels: { app: result }
  template:
    metadata:
      labels: { app: result, db-client: "true" }
    spec:
      enableServiceLinks: false # only explicit settings, no injected *_PORT variables
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: result
          image: nephele/result
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: nephele-secrets, key: DATABASE_URL }
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels: { app: result }
spec:
  selector: { app: result }
  ports:
    - port: 80
      targetPort: http
