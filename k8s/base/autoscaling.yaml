# Horizontal Pod Autoscalers: add pods when average CPU goes above the target.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vote
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: vote }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
---
# Keeps at least one vote pod up during node maintenance and upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vote
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: vote }
