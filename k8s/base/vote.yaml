# Vote: the web page people vote on. Stateless, so it runs as several pods
# behind one Service, spread across zones, and the autoscaler adds more under load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels: { app: vote }
spec:
  replicas: 2
  selector:
    matchLabels: { app: vote }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: vote, redis-client: "true" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Kubernetes would otherwise inject REDIS_PORT=tcp://<ip>:6379 for the
      # "redis" Service, which clashes with the app's own REDIS_PORT setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      # Always split across zones, so losing a zone keeps the page up.
      # nodeTaintsPolicy Honor: a failed (tainted) node's zone is left out of
      # the count, so replacements may start in the surviving zone at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: { app: vote }
      # Move off a failed node after 30 s instead of the default 5 minutes.
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      containers:
        - name: vote
          image: nephele/vote
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: nephele-config }
          ports:
            - containerPort: 8080
              name: http
          # Startup: up to 60 s to boot before the other probes begin.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Keep serving for 5 s after being told to stop, while the Ingress and
          # every node drop this pod from their endpoint lists.
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels: { app: vote }
spec:
  selector: { app: vote }
  ports:
    - port: 80
      targetPort: http
