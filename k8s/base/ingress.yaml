# One entry point for both web pages, routed by host name.
# *.localtest.me always resolves to 127.0.0.1, so no hosts-file edits are needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nephele
  annotations:
    # If a pod dies (or its node does) before Kubernetes removes it from the
    # Service, retry the request on another pod instead of failing the user.
    # Retrying a POST is safe here: a vote is an upsert keyed by voter ID.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "1"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504 non_idempotent"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-next-upstream-timeout: "4"
spec:
  ingressClassName: nginx
  rules:
    - host: vote.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: vote, port: { number: 80 } }
    - host: result.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: result, port: { number: 80 } }
