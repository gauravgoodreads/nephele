# AWS (EKS): images from ECR, Postgres on RDS, Redis on ElastiCache.
#
# Before applying:
#   1. terraform apply in infra/terraform
#   2. replace the two REPLACE_ME endpoints below with the Terraform outputs
#      db_endpoint and redis_endpoint
#   3. create secrets.env from secrets.env.example (never commit it)
#   4. set the image names (the CD workflow does this with `kustomize edit set image`)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: nephele/vote
    newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/nephele-vote
    newTag: latest
  - name: nephele/result
    newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/nephele-result
    newTag: latest
  - name: nephele/worker
    newName: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/nephele-worker
    newTag: latest
secretGenerator:
  - name: nephele-secrets
    namespace: nephele
    options:
      disableNameSuffixHash: true
    envs:
      - secrets.env
patches:
  # In-cluster Postgres, Redis and the backup CronJob are not needed on AWS.
  - path: remove-in-cluster-data.yaml
  # The apps keep using the names "db" and "redis"; on AWS those names
  # point at the managed services, so no application setting changes.
  - target: { kind: Service, name: db }
    patch: |-
      - op: replace
        path: /spec
        value:
          type: ExternalName
          externalName: nephele-db.REPLACE_ME.ap-south-1.rds.amazonaws.com
  - target: { kind: Service, name: redis }
    patch: |-
      - op: replace
        path: /spec
        value:
          type: ExternalName
          externalName: nephele-redis.REPLACE_ME.cache.amazonaws.com
  # Real host names for the load balancer (point them at it in Route 53).
  - target: { kind: Ingress, name: nephele }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: vote.nephele.example.com
      - op: replace
        path: /spec/rules/1/host
        value: result.nephele.example.com
