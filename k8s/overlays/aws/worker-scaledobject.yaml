# One worker per 50 waiting votes, between 1 and 10 workers.
# "redis" is the ExternalName Service that points at ElastiCache.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: nephele
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: redis
      metadata:
        address: redis.nephele.svc.cluster.local:6379
        listName: votes
        listLength: "50"
