# Local Kubernetes cluster for Nephele, running inside Docker.
# Port 8888 on this computer reaches the Ingress controller inside the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nephele
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8888
        protocol: TCP
