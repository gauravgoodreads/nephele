# Continuous integration: every push and pull request is unit-tested, built,
# scanned, validated, and then deployed to a real 3-node Kubernetes cluster
# (kind) inside the runner, where a smoke test and the resilience suite run.
# Pushes to main also publish versioned images to GitHub Container Registry.
name: nephele-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-vote:
    name: Unit tests (vote, Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside the test image
        run: |
          docker build --target test -t nephele/vote:test vote
          docker run --rm nephele/vote:test

  test-result:
    name: Unit tests (result, Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside the image
        run: |
          docker build -t nephele/result:test result
          docker run --rm nephele/result:test npm test

  build-images:
    name: Build and scan images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }}
        run: docker build -t nephele/${{ matrix.service }}:ci ${{ matrix.service }}
      - name: Check the image runs as a non-root user
        run: |
          user=$(docker image inspect nephele/${{ matrix.service }}:ci --format '{{.Config.User}}')
          echo "image user: '$user'"
          case "$user" in ""|0|root|0:*|root:*) echo "image runs as root"; exit 1;; esac
      - name: Scan for critical vulnerabilities (report only; set --exit-code 1 to fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 0 --no-progress \
            nephele/${{ matrix.service }}:ci

  validate-kubernetes:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate every overlay and add-on
        run: |
          cp k8s/overlays/aws/secrets.env.example k8s/overlays/aws/secrets.env
          for dir in k8s/overlays/local k8s/overlays/aws k8s/addons/monitoring; do
            echo "== $dir"
            kubectl kustomize $dir | kubeconform -strict -summary -
          done
          echo "== k8s/overlays/local-keda (KEDA's ScaledObject is a custom resource, so its schema is skipped)"
          kubectl kustomize k8s/overlays/local-keda | kubeconform -strict -summary -ignore-missing-schemas -
          kubeconform -strict -summary k8s/jobs/

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  e2e-kubernetes:
    name: End-to-end on Kubernetes (3-node kind)
    needs: [test-vote, test-result, validate-kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          kind version
      - name: Build the platform and deploy Nephele
        run: scripts/kind-up.sh
      - name: Smoke test (votes in, votes counted, monitoring scraping)
        run: scripts/smoke-test.sh
      - name: Resilience suite
        run: TESTS="1 2 3 4 6 7 8 9" scripts/chaos-test.sh
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n nephele get events --sort-by=.lastTimestamp | tail -50
          kubectl -n nephele logs -l app=worker --tail=100 --prefix
          kubectl -n nephele logs -l app=vote --tail=50 --prefix
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: tests/results/
          if-no-files-found: ignore

  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-images, validate-terraform, e2e-kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push, tagged with the commit
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in vote result worker; do
            image="ghcr.io/$owner/nephele-$svc"
            docker build -t "$image:${GITHUB_SHA}" -t "$image:latest" "$svc"
            docker push "$image:${GITHUB_SHA}"
            docker push "$image:latest"
          done
